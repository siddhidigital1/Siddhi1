<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddhi Digital - Digital Business Card</title>
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="5iHqx7tpDq20aWMNij2OtNtRAfIj_YhQgIPHngS-8Qs" />
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="card-container">
        <!-- Profile Section -->
        <div class="profile-header">
            <img src="logo.png" alt="Logo" class="profile-img">
            <h1>Siddhi Digital</h1>
            <p>Giving digital shape to your imaginations. Custom Digital Invitation Cards & Business Branding Design Services</p>
        </div>

        <!-- Direct Action Buttons -->
        <div class="action-buttons">
            <a href="tel:+919970279238" class="btn call"><i class="fa fa-phone"></i> Call Us </a>
            <a href="https://wa.me/919970279238" class="btn whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div>

        <!-- Services / Portfolio Section -->
        <div class="section">
            <h2>Our Services</h2>
            <div class="service-item">Service 1: Digital Promotions & Branding& logos</div>
            <div class="service-item">Service 2: Online Invitation cards </div>
        </div>

        <!-- Lead Capture Form -->
        <div class="section">
            <h2>Enquire Now</h2>
            <form action="  https://formspree.io/f/meeynezw" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="tel" name="phone" placeholder="Mobile Number" required>
                <textarea name="message" placeholder="Your Message" rows="3"></textarea>
                <button type="submit" class="btn submit">Send Inquiry</button>
            </form>
        </div>
    </div>
</body>
</html>
